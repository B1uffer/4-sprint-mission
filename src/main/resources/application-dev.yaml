# 데이터베이스 연결 정보, 서버 포트와 같은 설정값을 프로파일별로 분리하기
# application-dev는 개발 환경 전용 설정임
spring:
  config:
    activate:
      on-profile: dev # 이 파일을 dev라는 프로필로 사용하겠다고 설정함
  datasource:
    driver-class-name: org.postgresql.Driver # org.h2.driver 빨간줄뜸

server:
  port: 8080 # 서버포트 설정

logging:
  level:
    root: debug # 개발 환경에서 로그는 debug
    com.sprint.mission.discodeit: DEBUG
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SS} [%thread] %-5level %logger{36} - %msg%n" # 정규식